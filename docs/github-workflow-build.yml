# Fertige GitHub-Actions-Workflow-Datei zum Bauen des Mods.
#
# Bewusst NICHT unter .github/workflows/ abgelegt, weil der fuer dieses Repo
# genutzte GitHub-App-Token keine Workflow-Berechtigung hat (Push wuerde mit
# "refusing to allow a GitHub App to create or update workflow" scheitern).
#
# So aktivieren:
#   mkdir -p .github/workflows
#   cp docs/github-workflow-build.yml .github/workflows/build.yml
#   git add .github/workflows/build.yml && git commit -m "ci: build mod" && git push

name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: highlighter-jar
          path: build/libs/*.jar
          if-no-files-found: error
